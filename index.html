<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестовый сайт с заявкой</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .application {
            border: 1px solid #ccc;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            background-color: #f9f9f9;
            border-radius: 8px;
        }
        .application h2 {
            margin-top: 0;
        }
        .application p {
            margin: 10px 0;
        }
        .highlight {
            background-color: yellow;
        }
    </style>
</head>
<body>
    <div class="application">
        <h2>Заявка от клиента</h2>
        <p><strong>Тип потребности:</strong> <span id="needType">Участие</span></p>
        <p><strong>Предмет закупки:</strong> <span id="purchaseSubject">поставка продуктов питания (Сахар)</span></p>
        <p><strong>Начальная максимальная стоимость контракта:</strong> <span id="maxContractPrice">46 998,00 ₽</span></p>
        <p><strong>Стоимость, которую предлагает клиент:</strong> <span id="clientOfferPrice">45 540,00 ₽</span></p>
        <p><strong>Стоимость гарантии:</strong> <span id="guaranteeAmount">5%</span></p>
        <p><strong>Срок гарантии:</strong> <span id="guaranteePeriod">30.12.2025</span></p>
    </div>

    <script>
        // Функция для выделения различий
        function highlightDifferences(elementId, procurementValue) {
            const element = document.getElementById(elementId);
            if (element && element.textContent.trim() !== procurementValue) {
                element.classList.add('highlight');
                element.title = `На сайте гос. закупок: ${procurementValue}`;
            }
        }

        // Пример данных с сайта гос. закупок (для тестирования)
        const procurementData = {
            purchaseSubject: 'поставка продуктов питания (Мука)',
            maxPrice: '47 000,00 ₽',
            clientOfferPrice: '45 500,00 ₽',
            guaranteeAmount: '10%',
        };

        // Выделяем различия
        highlightDifferences('purchaseSubject', procurementData.purchaseSubject);
        highlightDifferences('maxContractPrice', procurementData.maxPrice);
        highlightDifferences('clientOfferPrice', procurementData.clientOfferPrice);
        highlightDifferences('guaranteeAmount', procurementData.guaranteeAmount);
    </script>
</body>
</html>
