<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестовый сайт заявок</title>
</head>
<body>
    <h1>Форма заявки на закупку</h1>
    <form id="purchaseForm">
        <label for="needType">Тип потребности:</label>
        <select id="needType" name="needType">
            <option value="participation">Участие</option>
            <option value="execution">Исполнение</option>
            <option value="overprovision">Переобеспечение</option>
            <option value="guarantee">Гарантийное обеспечение</option>
        </select><br><br>

        <label for="purchaseSubject">Предмет закупки:</label>
        <input type="text" id="purchaseSubject" name="purchaseSubject" required><br><br>

        <label for="maxContractPrice">Начальная максимальная стоимость контракта:</label>
        <input type="text" id="maxContractPrice" name="maxContractPrice" required><br><br>

        <label for="clientOfferPrice">Стоимость, которую предлагает клиент:</label>
        <input type="text" id="clientOfferPrice" name="clientOfferPrice" required><br><br>

        <label for="guaranteeAmount">Стоимость гарантии:</label>
        <input type="text" id="guaranteeAmount" name="guaranteeAmount" required><br><br>

        <label for="guaranteePeriod">Срок гарантии:</label>
        <input type="text" id="guaranteePeriod" name="guaranteePeriod" required><br><br>

        <button type="submit">Отправить заявку</button>
    </form>

    <h2>Список заявок</h2>
    <ul id="applicationsList"></ul>

    <script>
        document.getElementById('purchaseForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const application = {
                needType: document.getElementById('needType').value,
                purchaseSubject: document.getElementById('purchaseSubject').value,
                maxContractPrice: document.getElementById('maxContractPrice').value,
                clientOfferPrice: document.getElementById('clientOfferPrice').value,
                guaranteeAmount: document.getElementById('guaranteeAmount').value,
                guaranteePeriod: document.getElementById('guaranteePeriod').value
            };

            const li = document.createElement('li');
            li.textContent = JSON.stringify(application);
            document.getElementById('applicationsList').appendChild(li);

            // Очистка формы
            document.getElementById('purchaseForm').reset();
        });
    </script>
</body>
</html>
