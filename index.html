<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестовый сайт заявок</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { border: 1px solid black; padding: 8px; text-align: left; }
        th { background-color: #ddd; }
    </style>
</head>
<body>
    <h2>Список заявок</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Потребность</th>
                <th>Объект закупки</th>
                <th>Начальная цена</th>
                <th>Предложенная цена</th>
                <th>Стоимость гарантии</th>
                <th>Срок гарантии</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Участие</td>
                <td>Поставка продуктов (Молоко)</td>
                <td>500 000 ₽</td>
                <td>480 000 ₽</td>
                <td>5%</td>
                <td>12 месяцев</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Исполнение</td>
                <td>Строительные материалы</td>
                <td>1 200 000 ₽</td>
                <td>1 150 000 ₽</td>
                <td>3%</td>
                <td>18 месяцев</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
